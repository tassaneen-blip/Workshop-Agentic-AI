<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title><style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f7fb}body{margin:0}.wrap{max-width:860px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}a{color:#2563eb;text-decoration:none}.settings{display:flex;gap:10px;flex-wrap:wrap;background:white;padding:14px;border-radius:12px}.settings label{display:flex;flex-direction:column;gap:4px}select,input,button{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px}#messages{min-height:55vh;margin:16px 0;display:flex;flex-direction:column;gap:10px}.bubble{padding:12px 15px;border-radius:14px;max-width:75%;white-space:pre-wrap}.user{align-self:flex-end;background:#2563eb;color:white}.assistant{align-self:flex-start;background:white;box-shadow:0 1px 4px #dbe2ec}.composer{display:flex;gap:8px}.composer input{flex:1}.composer button{background:#2563eb;color:white;border:0}@media(max-width:600px){.bubble{max-width:90%}}
</style></head><body><main class="wrap"><div class="top"><h1>💬 หน้าต่าง Chat</h1><a href="/">กลับหน้าแรก</a></div><section class="settings"><label>Provider<select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></label><label>Model<input id="model" placeholder="ใช้ค่า default จากระบบ"></label></section><div id="messages" aria-live="polite"></div><form class="composer" id="form"><input id="message" autocomplete="off" placeholder="พิมพ์ข้อความ..." required><button>ส่ง</button></form></main><script src="/chat/app.js"></script></body></html>
