<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title><style>
:root{--ink:#10251d;--muted:#6c8279;--green:#16a574;--deep:#087f5b;--mint:#eafaf2;--line:#dcece4;--bg:#f4faf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#d4f7e3,transparent 27%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.app{max-width:1050px;height:100vh;margin:auto;padding:20px;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#20c997,#087f5b);color:#fff}.back{color:var(--muted);text-decoration:none;font-size:.9rem}.workspace{display:flex;flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px #0b513313;overflow:hidden}.side{width:245px;padding:25px 18px;background:linear-gradient(180deg,#f5fdf8,#effaf4);border-right:1px solid var(--line)}.side h1{font-size:1.25rem;margin:0 0 5px}.side p{color:var(--muted);font-size:.85rem;line-height:1.5;margin:0 0 26px}.label{color:#8aa097;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin:22px 10px 8px}.provider-list{display:grid;gap:7px}.provider-list label{display:flex;align-items:center;gap:9px;padding:10px;border-radius:10px;cursor:pointer;font-size:.9rem}.provider-list label:has(input:checked){background:var(--mint);color:var(--deep);font-weight:700}.provider-list input{accent-color:var(--green)}.model-label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:.8rem}.model-label input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--ink);outline-color:var(--green)}.main{display:flex;flex-direction:column;min-width:0;flex:1}.chat-head{padding:22px 28px;border-bottom:1px solid #edf4f0}.chat-head h2{font-size:1.05rem;margin:0 0 3px}.chat-head p{margin:0;color:var(--muted);font-size:.82rem}.messages{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:17px}.empty{text-align:center;margin:auto;color:var(--muted)}.empty-icon{display:grid;place-items:center;width:55px;height:55px;border-radius:17px;background:var(--mint);font-size:1.6rem;margin:0 auto 14px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.bubble{max-width:min(76%,620px);padding:13px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.6;font-size:.92rem}.user{align-self:flex-end;background:var(--deep);color:#fff;border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:#f3faf6;border:1px solid var(--line);border-bottom-left-radius:5px}.composer-wrap{padding:14px 22px 20px;border-top:1px solid #edf4f0}.composer{display:flex;gap:9px;background:#f6fbf8;border:1px solid var(--line);border-radius:14px;padding:6px 7px 6px 14px}.composer input{min-width:0;flex:1;border:0;background:transparent;outline:0;font:inherit;color:var(--ink)}.composer button{border:0;background:var(--deep);color:#fff;width:40px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer}.composer button:disabled{opacity:.55}.hint{text-align:center;color:#a0b1a9;font-size:.72rem;margin:8px 0 0}@media(max-width:700px){.app{padding:10px;height:100dvh}.side{display:none}.workspace{border-radius:17px}.messages{padding:20px 15px}.chat-head{padding:18px 17px}.composer-wrap{padding:12px 12px 15px}.bubble{max-width:88%}}
</style></head><body><main class="app"><header class="topbar"><div class="brand"><div class="mark">✦</div><span>AI Desk</span></div><a class="back" href="/">← Portal Hub</a></header><section class="workspace"><aside class="side"><h1>เริ่มแชทใหม่</h1><p>เลือก provider และโมเดลที่คุณต้องการ</p><div class="label">Provider</div><div class="provider-list"><label><input type="radio" name="provider" value="gemini" checked> ✦ Gemini</label><label><input type="radio" name="provider" value="openai"> ◇ OpenAI</label><label><input type="radio" name="provider" value="openai-compat"> ◎ Custom gateway</label></div><div class="label">Model</div><label class="model-label"><span>ระบุชื่อโมเดล (ถ้าต้องการ)</span><input id="model" placeholder="ใช้ค่า default"></label></aside><section class="main"><header class="chat-head"><h2>ผู้ช่วย AI</h2><p>พร้อมช่วยคุณคิด สร้างสรรค์ และลงมือทำ</p></header><div id="messages" class="messages" aria-live="polite"><div class="empty" id="empty"><div class="empty-icon">✦</div><strong>เริ่มต้นบทสนทนาของคุณ</strong><span>พิมพ์ข้อความด้านล่างเพื่อเริ่มพูดคุย</span></div></div><div class="composer-wrap"><form class="composer" id="form"><input id="message" autocomplete="off" placeholder="ถามอะไรก็ได้..." required><button aria-label="ส่งข้อความ">↑</button></form><div class="hint">AI อาจสร้างข้อมูลคลาดเคลื่อน กรุณาตรวจสอบคำตอบก่อนใช้งาน</div></div></section></section></main><script src="/chat/app.js"></script></body></html>
